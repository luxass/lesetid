name: GitHub Actions Security Analysis

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: luxass/shared-workflows/.github/workflows/ci-security.yaml@9770f7268daf358179c45895de8becc2e8525984 # v0.14.0
    with:
      zizmor-version: v1.23.1
