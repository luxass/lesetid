name: GitHub Actions Security Analysis

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: luxass/shared-workflows/.github/workflows/ci-security.yaml@10298e06aecc428b39ef4121636400396b53a1fa # v0.16.0
    with:
      zizmor-version: v1.23.1
