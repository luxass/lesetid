name: release

on:
  push:
    branches:
      - main

permissions: {}

# Never cancel a run that waits for npm approval.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'luxass/lesetid' }}
    timeout-minutes: 10
    outputs:
      has-changesets: ${{ steps.changeset.outputs.hasChangesets }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: install
        run: pnpm install --frozen-lockfile

      - name: check packages for common errors
        run: pnpm turbo --filter "./packages/*" build lint test typecheck

      - name: create or update version PR
        id: changeset
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: sync lockfile if necessary
        if: steps.changeset.outputs.hasChangesets == 'true'
        run: |
          git checkout changeset-release/main
          pnpm install --no-frozen-lockfile

          # Check for changes and only commit if there are any
          if git diff --exit-code; then
            echo "No changes to commit."
          else
            git add .
            git commit -m "chore(release): 📦 sync lockfile"
            git push origin changeset-release/main
          fi

  # Stage each unpublished package, and tag and release it only after npm serves the approved tarball.
  publish:
    needs: version
    if: ${{ needs.version.outputs.has-changesets == 'false' }}
    permissions:
      contents: write
      id-token: write
    uses: luxass/shared-workflows/.github/workflows/reusable-release-npm-staged-workspace.yaml@411fe8f8a0a53eab5153356ac5e0f174cd245eb2 # v0.17.1
