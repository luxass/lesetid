name: release

on:
  push:
    branches:
      - main

permissions: {}

# Never cancel a run that waits for npm approval.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'luxass/lesetid' }}
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    permissions:
      contents: read
    steps:
      - name: set up workspace
        uses: luxass/shared-workflows/actions/setup@8e84402c426badbcb2e7db5a88fd69eb41b5313f # actions/setup/v0.1.6
        with:
          node-version: "24"

      - name: select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version
    needs: select-mode
    if: ${{ needs.select-mode.outputs.mode == 'version' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: set up workspace
        uses: luxass/shared-workflows/actions/setup@8e84402c426badbcb2e7db5a88fd69eb41b5313f # actions/setup/v0.1.6
        with:
          node-version: "24"
          fetch-depth: 0

      # Workflow tokens may not open pull requests, and PRs they open run no CI.
      - name: generate release app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: luxass
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: create or update version PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: pnpm release:version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Stage each unpublished package, and tag and release it only after npm serves the approved tarball.
  publish:
    needs: select-mode
    if: ${{ needs.select-mode.outputs.mode == 'publish' }}
    permissions:
      contents: write
      id-token: write
    uses: luxass/shared-workflows/.github/workflows/reusable-release-npm-staged-workspace.yaml@411fe8f8a0a53eab5153356ac5e0f174cd245eb2 # v0.17.1
