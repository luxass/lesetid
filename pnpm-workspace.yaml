    "zod": 4.3.6
    "@astrojs/check": 0.9.8
    "@unocss/astro": 66.6.8
    "@unocss/reset": 66.6.8
    "unocss": 66.6.8
    "@astrojs/mdx": 5.0.3
    "@astrojs/rss": 4.0.18
    "@astrojs/sitemap": 3.7.2
