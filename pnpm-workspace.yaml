ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 7200
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true

minimumReleaseAgeExclude:
  - "@changesets/apply-release-plan@8.1.1"
  - "@changesets/cli@3.0.3"
  - "@changesets/config@4.0.1"

packages:
  - www
  - packages/*
  - examples/*
  - tooling/*

overrides:
  chokidar: 5.0.0

catalogs:
  runtime:
    hastscript: 9.0.1
    mdast-util-to-string: 4.0.0
    unist-util-visit: 5.1.0
    unified: 11.0.5
    vfile: 6.0.3

  dev:
    oxfmt: 0.67.0
    oxlint: 1.82.0
    oxlint-tsgolint: 7.0.2001
    publint: 0.3.24
    tsdown: 0.23.0
    typescript: 6.0.3
    volapyk: 2.1.0

  testing:
    "@vitest/coverage-v8": 5.0.0
    vitest: 5.0.0

  types:
    "@types/mdast": 4.0.4
    "@types/node": 24.13.4

  monorepo:
    "@changesets/changelog-github": 1.0.1
    "@changesets/cli": 3.0.3
    turbo: 2.9.7

  www:
    "@iconify-json/logos": 1.2.11
    "@iconify-json/ph": 1.2.2
    astro: 6.2.1
    unplugin-icons: 23.0.1
    zod: 4.4.2
    "@astrojs/check": 0.9.9
    "@unocss/astro": 66.6.8
    "@unocss/reset": 66.6.8
    unocss: 66.6.8
    "@astrojs/mdx": 5.0.4
    "@astrojs/rss": 4.0.18
    "@astrojs/sitemap": 3.7.2
    "@astrojs/cloudflare": 13.3.0
    wrangler: 4.87.0

  example:
    classnames: 2.5.1
    date-fns: 4.1.0
    gray-matter: 4.0.3
    next: 16.2.4
    react: 19.2.5
    react-dom: 19.2.5
    remark-html: 16.0.1
    remark: 15.0.1
    "@tailwindcss/postcss": 4.2.4
    "@types/react": 19.2.14
    "@types/react-dom": 19.2.3
    postcss: 8.5.13
    tailwindcss: 4.2.4
