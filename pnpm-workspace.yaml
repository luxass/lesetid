ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 7200
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true

packages:
  - www
  - packages/*
  - examples/*
  - tooling/*

overrides:
  chokidar: 5.0.0

catalogs:
  dev:
    oxfmt: 0.79.0
    oxlint: 1.94.0
    oxlint-tsgolint: 7.0.2007
    publint: 0.3.25
    tsdown: 0.23.7
    typescript: 7.0.2

  framework:
    # Astro and Next.js still use the TypeScript compiler API.
    typescript: 6.0.3

  types:
    "@types/node": 26.6.6

  testing:
    vitest: 5.1.0
    "@vitest/coverage-v8": 5.1.0

  monorepo:
    "@changesets/changelog-github": 1.0.1
    "@changesets/cli": 2.31.0
    turbo: 2.11.13
    volapyk: 2.2.0

  lesetid:
    "hastscript": 9.0.3
    "mdast-util-to-string": 4.0.0
    "unist-util-visit": 5.2.0
    "unified": 11.0.5
    "vfile": 6.0.3
    "@types/mdast": 4.0.4

  remark-lesetid:
    "hastscript": 9.0.3
    "mdast-util-to-string": 4.0.0
    "unist-util-visit": 5.2.0
    "unified": 11.0.5
    "vfile": 6.0.3
    "@types/mdast": 4.0.4

  satteri-lesetid:
    satteri: 0.11.7

  www:
    "@iconify-json/logos": 1.2.20
    "@iconify-json/ph": 1.2.2
    "astro": 6.4.8
    unplugin-icons: 23.0.1
    "zod": 4.6.7
    "@astrojs/check": 0.9.12
    "@unocss/astro": 66.13.0
    "@unocss/reset": 66.13.0
    "unocss": 66.13.0
    "@astrojs/mdx": 5.0.6
    "@astrojs/rss": 4.0.19
    "@astrojs/sitemap": 3.7.6
    "@astrojs/cloudflare": 13.7.0
    wrangler: 4.165.0

  example:
    "classnames": 2.5.1
    "date-fns": 4.4.0
    "gray-matter": 4.0.3
    "next": 16.4.6
    "react": 19.3.1
    "react-dom": 19.3.1
    "remark-html": 16.0.1
    "remark": 15.0.1
    "@tailwindcss/postcss": 4.3.5
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    "postcss": 8.5.33
    "tailwindcss": 4.3.5
