  - packages/*
  - examples/*
  - tooling/*

catalogs:
  linting:
    "@luxass/eslint-config": 7.4.2
    "eslint": 10.2.1
    "eslint-plugin-format": 2.0.1
    "@unocss/eslint-plugin": 66.6.8
    "astro-eslint-parser": 1.4.0
    "eslint-plugin-astro": 1.7.0
    "prettier-plugin-astro": 0.14.1

  testing:
    vitest: 4.1.4
    "@vitest/coverage-v8": 4.1.4

  monorepo:
    "@changesets/changelog-github": 0.6.0
    "@changesets/cli": 2.31.0
    tsdown: 0.21.9
    turbo: 2.9.6
    typescript: 6.0.3
    volapyk: 2.1.0
    publint: 0.3.18

  lesetid:
    "hastscript": 9.0.1
    "mdast-util-to-string": 4.0.0
    "unist-util-visit": 5.1.0
    "unified": 11.0.5
    "vfile": 6.0.3
    "@types/mdast": 4.0.4
    "@types/node": 25.6.0

  remark-lesetid:
    "hastscript": 9.0.1
    "mdast-util-to-string": 4.0.0
    "unist-util-visit": 5.1.0
    "unified": 11.0.5
    "vfile": 6.0.3
    "@types/mdast": 4.0.4
    "@types/node": 25.6.0

