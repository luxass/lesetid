ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true

packages:
  - www
  - packages/*
  - examples/*
  - tooling/*

overrides:
  chokidar: 5.0.0

catalogs:
  linting:
    "@luxass/eslint-config": 7.4.2
    "eslint": 10.2.1
    "eslint-plugin-format": 2.0.1
    "@unocss/eslint-plugin": 66.6.8
    "astro-eslint-parser": 1.4.0
    "eslint-plugin-astro": 1.7.0
    "prettier-plugin-astro": 0.14.1

  testing:
    vitest: 4.1.4
    "@vitest/coverage-v8": 4.1.4

  monorepo:
    "@changesets/changelog-github": 0.7.0
    "@changesets/cli": 2.31.1
    tsdown: 0.23.0
    turbo: 2.9.7
    typescript: 6.0.3
    volapyk: 2.1.0
    publint: 0.3.25

  lesetid:
    "hastscript": 9.0.1
    "mdast-util-to-string": 4.0.0
    "unist-util-visit": 5.1.0
    "unified": 11.0.5
    "vfile": 6.0.3
    "@types/mdast": 4.0.4
    "@types/node": 25.9.9

  remark-lesetid:
    "hastscript": 9.0.1
    "mdast-util-to-string": 4.0.0
    "unist-util-visit": 5.1.0
    "unified": 11.0.5
    "vfile": 6.0.3
    "@types/mdast": 4.0.4
    "@types/node": 25.9.9

  www:
    "@iconify-json/logos": 1.2.15
    "@iconify-json/ph": 1.2.2
    "astro": 6.2.1
    unplugin-icons: 23.0.1
    "zod": 4.6.5
    "@astrojs/check": 0.9.10
    "@unocss/astro": 66.10.5
    "@unocss/reset": 66.10.5
    "unocss": 66.10.5
    "@astrojs/mdx": 5.0.6
    "@astrojs/rss": 4.0.18
    "@astrojs/sitemap": 3.7.4
    "@astrojs/cloudflare": 13.7.0
    wrangler: 4.147.0

  example:
    "classnames": 2.5.1
    "date-fns": 4.4.0
    "gray-matter": 4.0.3
    "next": 16.2.4
    "react": 19.3.0
    "react-dom": 19.3.0
    "remark-html": 16.0.1
    "remark": 15.0.1
    "@tailwindcss/postcss": 4.3.3
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    "postcss": 8.5.13
    "tailwindcss": 4.3.3
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@10.34.5
  - pnpm@10.34.5
